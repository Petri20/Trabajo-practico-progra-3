<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Automóvil</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Eliminar Automóvil</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="consulta.html">Consultar</a>
        <a href="alta.html">Agregar</a>
        <a href="modificar.html">Modificar</a>
    </nav>

    <main>

        <section>

            <h2>Buscar automóvil</h2>

            <form id="formBuscar">

                <label for="idBusqueda">ID</label>

                <input
                    type="number"
                    id="idBusqueda"
                    min="1"
                    required
                >

                <button type="submit">
                    Buscar
                </button>

            </form>

        </section>

        <section>

            <h2>Datos del automóvil</h2>

            <div id="datosAuto">

                <p><strong>ID:</strong> <span id="id"></span></p>

                <p><strong>Marca:</strong> <span id="marca"></span></p>

                <p><strong>Precio:</strong> <span id="precio"></span></p>

                <p><strong>Color:</strong> <span id="color"></span></p>

            </div>

            <button id="btnEliminar">
                Eliminar automóvil
            </button>

            <div id="mensaje"></div>

        </section>

    </main>

    <script src="eliminar.js"></script>

</body>
</html>
