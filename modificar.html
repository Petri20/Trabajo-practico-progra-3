<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Automóvil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Modificar Automóvil</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="consulta.html">Consultar</a>
        <a href="alta.html">Agregar</a>
        <a href="eliminar.html">Eliminar</a>
    </nav>

    <main>

        <section>

            <h2>Buscar automóvil</h2>

            <form id="formBuscar">

                <label for="idBusqueda">ID</label>

                <input
                    type="number"
                    id="idBusqueda"
                    min="1"
                    required
                >

                <button type="submit">
                    Buscar
                </button>

            </form>

        </section>

        <section>

            <h2>Datos del automóvil</h2>

            <form id="formModificar">

                <label for="id">ID</label>

                <input
                    type="number"
                    id="id"
                    readonly
                >

                <label for="marca">Marca</label>

                <input
                    type="text"
                    id="marca"
                    required
                >

                <label for="precio">Precio</label>

                <input
                    type="number"
                    id="precio"
                    min="1"
                    required
                >

                <label for="color">Color</label>

                <input
                    type="color"
                    id="color"
                    required
                >

                <button type="submit">
                    Modificar
                </button>

            </form>

            <div id="mensaje"></div>

        </section>

    </main>

    <script src="modificar.js"></script>

</body>
</html>
